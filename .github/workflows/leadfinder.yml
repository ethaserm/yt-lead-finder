name: Lead finder

on:
  schedule:
    # Twice an hour (:23 and :53 UTC). GitHub delays or drops a lot of scheduled runs, so each run works out how
    # long it's been since the last one that actually ran and does that many hours' worth of searches
    # (SEARCHES_PER_HOUR, capped at MAX_SEARCHES_PER_RUN). ~3 searches/hour x 24 = ~72 searches, ~7,500 of the free
    # 10,000 units/day; DAILY_QUOTA_BUDGET stops it at 9,000 whatever happens.
    # The emailer runs at :08 and :38 (and takes up to ~12 min), so the two never edit the Business Queue at once.
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write to the Sheet or move the rotation)"
        type: boolean
        default: true

permissions:
  contents: write   # lets the job commit state.json so the rotation cursor survives between runs

concurrency:
  group: yt-lead-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # hard cap so a hung site fetch can't burn Actions minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find leads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SEARCHES_PER_HOUR: "3"
          MAX_SEARCHES_PER_RUN: "10"
          MAX_NEW_PER_RUN: "60"
          DAILY_QUOTA_BUDGET: "9000"
          RUN_QUOTA_BUDGET: "1500"
          REFRESH_PER_RUN: "40"
          MAX_SITE_FETCHES: "60"
          RUN_BUDGET_SECONDS: "420"
        run: python leadfinder.py

      # The CSV holds contact emails, so it's only uploaded as an artifact if the repo is ever made private.
      # (Logs never print email addresses.)
      - name: Upload preview CSV
        if: always() && github.event.repository.private == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lead-preview
          path: output/*.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Save rotation state
        if: always()
        run: |
          git config user.name "leadfinder-bot"
          git config user.email "leadfinder-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Update lead finder state" && git pull --rebase -q && git push)
